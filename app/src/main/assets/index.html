<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}html{scroll-padding-top:0}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Sundar Patro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/mukta.css">
</head><body>
<style>
/* Layout: white canvas, 7/5 split (grid left, day card right) on desktop, stacked on phones; light footer closes the page. Tokens follow the Cal.com system. */
:root{
  --canvas:#ffffff; --surface-soft:#f8f9fa; --surface-card:#f5f5f5; --surface-strong:#e5e7eb;
  --hairline:#e5e7eb; --hairline-soft:#f3f4f6;
  --ink:#111111; --body:#111111; --muted:#3f3f46; --muted-soft:#6b7280;
  --primary:#111111; --primary-active:#242424; --on-primary:#ffffff;
  --accent:#3b82f6; --success:#10b981; --warning:#f59e0b; --error:#ef4444;
  --orange:#fb923c; --pink:#ec4899; --violet:#8b5cf6; --emerald:#34d399;
  --holiday-bg:#fff1f2; --holiday-fg:#be123c; --fest-bg:#fef3c7; --fest-fg:#b45309; --sat-fg:#dc2626;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 12px rgba(0,0,0,.08); color-scheme:light;
  --tag-fav:#047857; --tag-neu:#92400e; --tag-avoid:#b91c1c; --tab-active:#ffffff; --switch-off:#cfd3d9; --switch-on:#111111;
  --font-ui:"Mukta",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-ne:"Mukta","Noto Sans Devanagari",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.tab,.tb,.cell,.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.lang-ne{font-family:var(--font-ne)}
body.lang-ne .btn,body.lang-ne .tab,body.lang-ne .tb,body.lang-ne select,body.lang-ne input{font-family:var(--font-ne)}
body{margin:0;background:var(--canvas);color:var(--body);font-family:var(--font-ui);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:500}
.ne{font-family:var(--font-ne)}
h1,h2,h3{color:var(--ink);font-weight:600;margin:0;text-wrap:balance}
.display-lg{font-size:clamp(28px,5vw,48px);line-height:1.15;letter-spacing:-.02em}
.display-md{font-size:clamp(24px,4vw,36px);line-height:1.2;letter-spacing:-.015em}
.display-sm{font-size:28px;line-height:1.25;letter-spacing:-.01em}
.title-md{font-size:19px;font-weight:600;color:var(--ink);line-height:1.4}
.title-sm{font-size:17px;font-weight:600;color:var(--ink)}
.caption{font-size:14px;font-weight:500;line-height:1.4;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top nav */
body::before{display:none}
.topnav{position:sticky;top:0;z-index:9;background:var(--canvas);border-bottom:1px solid var(--hairline-soft)}
.topnav .wrap{height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{padding:4px 9px;min-width:32px;font-size:13px;line-height:1.2;text-align:center}

.wordmark{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:600;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.wordmark .brand-icon{width:22px;height:22px;display:block;flex-shrink:0;color:var(--ink)}
.pillgroup{display:flex;gap:2px;background:var(--surface-soft);border-radius:9999px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.pillgroup::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:500 14px/1.4 var(--font-ui);padding:5px 12px;border-radius:9999px;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"],.tab[aria-pressed="true"]{background:var(--tab-active);color:var(--ink);box-shadow:var(--shadow-sm)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tab:focus-visible,.btn:focus-visible,.cell:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons & inputs */
.btn{appearance:none;border:1px solid transparent;border-radius:8px;height:40px;padding:0 20px;font:600 15px/1 var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:active{background:var(--primary-active)}
.btn-secondary{background:var(--canvas);color:var(--ink);border-color:var(--hairline)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9999px;justify-content:center;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);font-size:18px;cursor:pointer}
select,input[type="number"],input[type="date"]{appearance:none;-webkit-appearance:none;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);border-radius:8px;height:40px;padding:0 14px;font:400 16px var(--font-ui);width:100%;min-width:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}

/* sections */
main{padding-block:32px 64px}
.view{display:grid;gap:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head .sub{color:var(--muted);font-size:15px;margin-top:4px}
.navrow{display:flex;align-items:center;gap:8px}
.nav-ring{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.nav-ring:active{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.nav-ring:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.nav-ring{transition:box-shadow .15s}}
.t-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

.split{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:1024px){.split{grid-template-columns:7fr 5fr;align-items:start}.split.solo{grid-template-columns:1fr}}
.daycard .close{float:right}
.clocks{display:grid;gap:8px;margin:0 0 14px;min-width:0}
.clock-row{display:flex;gap:8px;min-width:0}
.clock-row .npt{min-width:0;flex:0 1 auto}
.clock-row .npt span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.clock-row .npt time{flex:none}
.clock-row.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.clock-row.extra .npt{flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;padding:6px 12px;line-height:1.3}
.clock-row.extra .npt span{max-width:100%;white-space:nowrap;font-size:13px}
.clock-row.extra .npt time{font-size:15px}
.npt{display:flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:14px;font-weight:500;color:var(--muted);background:var(--canvas);border:1px solid var(--hairline);white-space:nowrap}
.npt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.npt time{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;min-width:0}
.wname{flex:1;min-width:0;display:flex;flex-direction:column}
.wname b{color:var(--ink);font-weight:600;font-size:16px}
.wname time{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.wrow .btn{height:36px;padding:0 14px;font-size:14px;flex:none}
.form.wform{margin-top:16px;grid-template-columns:1fr auto;align-items:end}
#daycard{scroll-margin-top:62px}

/* calendar grid */
.cal{background:var(--canvas);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;min-width:0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--hairline)}
.dow div{padding:10px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.dow div.sat{color:var(--sat-fg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{appearance:none;border:0;border-right:1px solid var(--hairline-soft);border-bottom:1px solid var(--hairline-soft);background:var(--canvas);min-height:74px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--body);font-family:var(--font-ui);text-align:center;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell.blank{background:var(--surface-soft);cursor:default}
.cell .bs{font-family:var(--font-ne);font-size:24px;font-weight:600;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.cell.sat .bs,.cell.holiday .bs{color:var(--holiday-fg)}
.cell.holiday{background:var(--holiday-bg)}
.cell .ad{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .ti{font-size:13px;font-weight:500;color:var(--muted);font-family:var(--font-ne);line-height:1.25}
.cell .ev{font-size:13px;line-height:1.25;color:var(--ink);font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cell.today .bs{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .dots{display:flex;gap:3px;margin-top:auto;min-height:5px}
.cell .dots i{width:5px;height:5px;border-radius:9999px;display:block}
.cell .ti{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.cell{min-height:64px;padding:5px 2px 3px}.cell .bs{font-size:20px}.cell .ev{display:none}body:not(.lang-ne) .cell .ti{font-size:12px;letter-spacing:-.01em}}

/* cards */
.card{background:var(--surface-card);border-radius:12px;padding:24px;min-width:0}
.card-white{background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;padding:24px;box-shadow:var(--shadow-sm);min-width:0}
.daycard .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.daycard .big .n{font-family:var(--font-ne);font-size:58px;font-weight:600;color:var(--ink);line-height:1.05}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin-top:16px}
.kv dt{color:var(--muted);font-weight:500;margin:0}
.kv dd{margin:0;color:var(--ink);min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:13px;font-weight:500;background:var(--surface-card);color:var(--ink);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:9999px;display:inline-block}
.pill.hol{background:var(--holiday-bg);color:var(--holiday-fg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.evlist{display:grid;gap:10px;margin-top:16px}
.evitem{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:15px}
.evitem i{width:8px;height:8px;border-radius:9999px;margin-top:6px;display:block}
.evitem .t{color:var(--ink);font-weight:600}
.evitem .d{color:var(--muted);font-size:14px}
.verdicts{display:grid;gap:8px;margin-top:16px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--canvas);border:1px solid var(--hairline)}
.verdict b{color:var(--ink);font-weight:600}
.vtag{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:9999px;white-space:nowrap}
.v-fav{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--tag-fav)}
.v-neu{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--tag-neu)}
.v-avoid{background:color-mix(in srgb,var(--error) 16%,transparent);color:var(--tag-avoid)}
.v-reasons{color:var(--muted)}

/* lists */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:12px 16px;background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;cursor:pointer;text-align:left;font-family:var(--font-ui);color:var(--body);min-width:0}
.row.hol{background:var(--holiday-bg);border-color:transparent}
.row .dt{font-family:var(--font-ne);font-weight:600;color:var(--ink);font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .dt small{display:block;font-family:var(--font-ui);font-weight:500;color:var(--muted);font-size:14px}
.row .nm{color:var(--ink);font-weight:600;font-size:16px;min-width:0}
.row .nm small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.row .tg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.more-row .dt svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.more-row .tg{font-size:20px;color:var(--muted)}
.back{justify-self:start;width:max-content}
/* festivals vs holidays: each list announces itself with its own icon and color */
#view-festivals{--kind-fg:var(--fest-fg);--kind-bg:var(--fest-bg)}
#view-holidays{--kind-fg:var(--holiday-fg);--kind-bg:var(--holiday-bg)}
#view-festivals .nav-ring,#view-holidays .nav-ring{--accent:var(--kind-fg)}
.kindhead{display:flex;gap:14px;align-items:flex-start}
.kindicon{flex:none;width:48px;height:48px;border-radius:14px;background:var(--kind-bg);color:var(--kind-fg);display:grid;place-items:center;margin-top:4px}
.kindicon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.kindhead h1{color:var(--kind-fg)}
.kmonth{font-size:20px;font-weight:600;color:var(--ink);margin-top:2px}
#f-list .row.hol{background:var(--canvas);border-color:var(--hairline)}
.ksum{margin:0;padding:10px 14px;border-radius:12px;background:var(--kind-bg);color:var(--kind-fg);font-weight:600;font-size:15px}
.ksum:empty{display:none}
.hrow{background:var(--holiday-bg);border-color:transparent}
.hrow .dt{font-size:22px}
.hrow .dt small{font-size:14px}
.hrow .pill{background:var(--canvas)}
.hrow .wd{display:block;font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--holiday-fg)}
.monthhead{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 4px}
.monthhead:first-child{margin-top:0}
@media(max-width:480px){.row{grid-template-columns:92px 1fr}.row .tg{grid-column:1/-1;justify-content:flex-start}}

.form{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.form{grid-template-columns:1fr 1fr}.form .span2{grid-column:1/-1}}
.result{margin-top:16px;padding:16px;background:var(--canvas);border:1px solid var(--hairline);border-radius:8px}
.result .r{font-family:var(--font-ne);font-size:clamp(22px,4vw,30px);font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.result .s{color:var(--muted);font-size:15px;margin-top:4px}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:9999px;display:inline-block}
.two{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:768px){.two{grid-template-columns:1fr 1fr}}
.cta{background:var(--surface-card);border-radius:12px;padding:32px;text-align:center}
.cta p{max-width:60ch;margin:8px auto 0;color:var(--muted);font-size:15px}

.tabbar{display:none}
@media(max-width:767px){
  .pillgroup.views{display:none}
  .topnav .wrap{height:46px;padding-block:0;flex-wrap:nowrap}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);background:var(--canvas);border-top:1px solid var(--hairline);padding-bottom:0}
  .tb{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px/1.2 var(--font-ui);padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;min-width:0}
  .tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .tb[aria-current="page"]{color:var(--ink)}
  .tb[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--ink)}
  .tb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  main{padding-top:0;padding-bottom:32px}
  .view:not(#view-today){padding-top:12px}
  footer{padding-bottom:calc(48px + 60px + env(safe-area-inset-bottom,0px))}
}
footer{background:var(--surface-soft);border-top:1px solid var(--hairline);color:var(--body);font-size:16px;padding-top:48px;padding-bottom:48px;margin-top:48px}
footer .wrap{display:grid;gap:8px}
footer h4{color:var(--ink);font-size:15px;font-weight:600;margin:0 0 10px}
footer p,footer li{margin:0 0 8px;line-height:1.55}
footer ul{padding-left:18px;margin:0}
footer .mark{color:var(--ink);font-weight:600;font-size:19px;letter-spacing:-.02em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
footer .mark .dot{width:10px;height:10px;border-radius:9999px;background:var(--ink)}
@media(max-width:767px){
  footer{background:transparent;border-top:0;margin-top:0;padding-top:8px;padding-bottom:calc(16px + 60px + env(safe-area-inset-bottom,0px))}
  footer .mark{display:none}
  footer p{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
}
@media(prefers-reduced-motion:no-preference){.tab,.btn{transition:background .12s}}

/* dark theme: opt-in from More > Dark mode. Light is the default. Palette follows the Claude app dark UI. */
:root[data-theme="dark"]{
  --canvas:#151515; --surface-soft:#1c1c1b; --surface-card:#20201f; --surface-strong:#313131;
  --hairline:#32322f; --hairline-soft:#262625;
  --ink:#f9f9f7; --body:#f0efea; --muted:#c4c2bb; --muted-soft:#93918a;
  --primary:#f9f9f7; --primary-active:#e4e3de; --on-primary:#151515;
  --accent:#d97757; --holiday-bg:#2a1a19; --holiday-fg:#ff9a9a; --fest-bg:#2a2214; --fest-fg:#fbbf24; --sat-fg:#ff8f87;
  --tag-fav:#4ade80; --tag-neu:#fbbf24; --tag-avoid:#ff8f87; --tab-active:#313131; --switch-off:#3d3d3b; --switch-on:#c6613f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.5); color-scheme:dark}
/* Compact More view */
#view-more{max-width:640px;margin:0 auto;gap:14px}
#view-more .head h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
#view-more .head .sub{font-size:13px;margin-top:2px}
.more-group{background:var(--canvas);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.more-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:transparent;border:0;border-bottom:1px solid var(--hairline-soft);cursor:pointer;text-align:left;font-family:var(--font-ui);color:var(--body);width:100%;transition:background .12s;-webkit-tap-highlight-color:transparent}
.more-item:last-child{border-bottom:0}
.more-item:active{background:var(--surface-soft)}
.more-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.more-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.more-icon svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.more-icon.ic-ausp{background:rgba(245,158,11,.12);color:#d97706}
.more-icon.ic-conv{background:rgba(59,130,246,.12);color:#2563eb}
.more-icon.ic-about{background:rgba(16,185,129,.12);color:#059669}
.more-icon.ic-priv{background:rgba(14,165,233,.12);color:#0284c7}
.more-icon.ic-supp{background:rgba(225,29,72,.12);color:#e11d48}
.more-icon.ic-theme{background:rgba(139,92,246,.12);color:#7c3aed}
.more-icon svg .half{fill:currentColor}

function momentJ(g,mo){ if(mo==='sunrise')return sunEvent(g.y,g.m,g.d,false); if(mo==='sunset')return sunEvent(g.y,g.m,g.d,true);
  if(mo==='midnight')return jd(g.y,g.m,g.d,24-TZ); if(mo==='morning')return jd(g.y,g.m,g.d,10-TZ); if(mo==='afternoon')return jd(g.y,g.m,g.d,14-TZ); return jd(g.y,g.m,g.d,12-TZ); }
const eventCache=new Map();
function yearEvents(by){ if(eventCache.has(by))return eventCache.get(by); const map=new Map(); const add=(n,ev)=>{(map.get(n)||map.set(n,[]).get(n)).push(ev);};
  const start=YEAR_START_DAYS[by-BS_START], end=YEAR_START_DAYS[by-BS_START+1];
  for(const r of RULES){
    if(r.k==='bs'){add(bs2dnum(by,r.m,r.d),r);}
    else if(r.k==='ad'){for(const gy of [by-57,by-56]){const n=dnum(gy,r.m,r.d); if(n>=start&&n<end)add(n,r);}}
    else if(r.k==='islamic'){for(let n=start;n<end;n++){const h=islamic(n); if(h.m===r.m&&h.d===r.d)add(n,r);}}
  }
  // lunar: scan the year at each distinct moment
  const moments=[...new Set(RULES.filter(r=>r.k==='lunar').map(r=>r.mo).concat(['sunset']))];
  const lunarByMoment={}; for(const mo of moments){lunarByMoment[mo]=[]; for(let n=start;n<end;n++){lunarByMoment[mo].push(lunarInfo(momentJ(fromDnum(n),mo)));}}
  const hit=(li,r)=>li.purnimanta===LM[r.lm]&&li.paksha===r.p&&li.tithi===r.t&&!li.adhik;
  for(const r of RULES.filter(r=>r.k==='lunar')){ const arr=lunarByMoment[r.mo], alt=lunarByMoment.sunset; const P=new Set();
    for(let i=0;i<arr.length;i++)if(hit(arr[i],r))P.add(i);
    const days=[...P]; // a kshaya tithi never reaches the reference moment: take the day it falls in, judged at dusk
    for(let i=0;i<alt.length;i++)if(hit(alt[i],r)&&!P.has(i)&&!P.has(i-1)&&!P.has(i+1))days.push(i);
    days.sort((a,b)=>a-b); let last=-9; for(const i of days){ if(i-last>1)add(start+i+(r.off||0),r); last=i; } }
  eventCache.set(by,map); return map; }

function saait(info,type){const R=[]; let block=null;
  const lm=info.purnimanta, p=info.paksha, t=info.tithi, raw=info.raw;
  if(info.adhik)block={code:'adhik'};
  else if(type!=='pasni'&&type!=='general'&&(info.rashi===8||info.rashi===11))block={code:'kharmas',rashi:info.rashi};
  else if(type!=='pasni'&&type!=='general'&&(lm===LM.Shrawan||lm===LM.Bhadra||lm===LM.Asoj||(lm===LM.Asar&&p==='Shukla'&&t>=11)||(lm===LM.Kartik&&!(p==='Shukla'&&t>=11))))block={code:'chaturmas'};
  else if(lm===LM.Asoj&&p==='Krishna')block={code:'pitri'};
  else if(lm===LM.Falgun&&p==='Shukla'&&t>=8)block={code:'holashtak'};
  else if(raw===30)block={code:'amavasya'};
  if(block)return {v:'avoid',reasons:[{k:'block',...block}]};
  let good=0,bad=0;
  if(MONTH_GOOD[type].includes(lm)){good++;R.push({k:'month',i:lm,s:'good'});} else {bad++;R.push({k:'month',i:lm,s:'bad'});}
  if(TITHI_GOOD.includes(t)){good++;R.push({k:'tithi',i:t-1,raw,s:'good'});} else if(TITHI_BAD.includes(t)){bad++;R.push({k:'tithi',i:t-1,raw,s:'bad'});} else R.push({k:'tithi',i:t-1,raw,s:'neu'});
  if(DOW_GOOD[type].includes(info.g.dow)){good++;R.push({k:'dow',i:info.g.dow,s:'good'});} else if(info.g.dow===2||info.g.dow===6){bad++;R.push({k:'dow',i:info.g.dow,s:'bad'});} else R.push({k:'dow',i:info.g.dow,s:'neu'});
  if(NAK_GOOD[type].includes(info.nak)){good++;R.push({k:'nak',i:info.nak,s:'good'});} else if(NAK_BAD.includes(info.nak)){bad++;R.push({k:'nak',i:info.nak,s:'bad'});} else R.push({k:'nak',i:info.nak,s:'neu'});
  const v=bad>0?'avoid':(good>=3?'favorable':'neutral'); return {v,reasons:R}; }

  const [ay,am,ad_]=ad.value.split('-').map(Number); const bs=dnum2bs(dnum(ay,am,ad_));
  if(bs){const info=dayInfo(dnum(ay,am,ad_)); $('#c-ad-out').textContent=`${DOWN(info.g.dow)}, ${fmtBSl(bs)}`; $('#c-ad-sub').innerHTML=`${ne_?'':`<span lang="ne">${fmtBS(bs)}</span> · `}${TN(info.raw)}, ${PAK(info.paksha)} ${t('day.paksha')}`;}
  else {$('#c-ad-out').textContent=t('conv.range'); $('#c-ad-sub').textContent=t('conv.supported');}
}
function showView(v,keepScroll){
  document.querySelectorAll('.view').forEach(sec=>sec.hidden=sec.id!=='view-'+v);
  const navV=(v==='auspicious'||v==='convert'||v==='clocks'||v==='about'||v==='privacy'||v==='support')?'more':v;
  document.querySelectorAll('.tab[data-view],.tb').forEach(tb=>{if(tb.dataset.view===navV)tb.setAttribute('aria-current','page');else tb.removeAttribute('aria-current');});
  if(v==='today'){renderToday();} else if(v==='month'){renderMonth();renderDay();} else if(v==='festivals'||v==='holidays'){if(!keepScroll)listM={y:todayBS.y,m:todayBS.m}; renderList(v);} else if(v==='auspicious'){renderAusp();} else if(v==='clocks'){renderClocks();} else if(v==='convert'){renderConvert();}
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(e){}} if(!keepScroll)window.scrollTo({top:0});
}
document.querySelectorAll('.tab[data-view],.tb,.more-row,.back').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));

/* ============ Holiday reminders (Android app only) ============
   Festivals and public holidays in the next 90 days become one notification per day, at 6 PM local
   time the evening before. The page builds the text; the app stores it and posts it on time. */
const REMIND_DAYS=90, REMIND_HOUR=18;
function pushReminders(){ const R=window.SundarNative; if(!R||!R.remindersEnabled())return;
  const out=[], now=Date.now();
  for(let n=todayN;n<=todayN+REMIND_DAYS;n++){ const evs=eventsFor(n).filter(e=>e.hol||e.cat==='festival'); if(!evs.length)continue;
    const eve=fromDnum(n-1), at=new Date(eve.y,eve.m-1,eve.d,REMIND_HOUR,0,0).getTime(); if(at<=now)continue;
    const i=dayInfo(n), scopes=[...new Set(evs.filter(e=>e.hol).map(e=>hol(e.hol)))];
    out.push({at,title:`${t('remind.tom')}: ${evs.map(EV).join(' · ')}`,
      body:[`${DOWN(i.g.dow)}, ${N(i.bs.d)} ${MON(i.bs.m-1)} ${N(i.bs.y)} · ${fmtAD(i.g)}`,...scopes].join(' · ')}); }
  R.setReminders(JSON.stringify(out)); }
(function(){ const R=window.SundarNative, row=$('#remindRow'); if(!R||!row)return; row.hidden=false;
  const show=(on,blocked)=>{row.setAttribute('aria-checked',on?'true':'false'); const d=$('#remindDesc'); d.dataset.t=blocked?'more.remind.blocked':'more.remind.sub'; d.textContent=t(d.dataset.t);};
  window.onRemindersChanged=(on,blocked)=>{show(on,blocked&&!on); if(on)pushReminders();};
  show(R.remindersEnabled(),false);
  row.addEventListener('click',()=>{ if(row.getAttribute('aria-checked')==='true')R.disableReminders(); else R.enableReminders(); });
  pushReminders(); })();
</script>
